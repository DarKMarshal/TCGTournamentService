spring.datasource.url=jdbc:sqlserver://<your-server>.database.windows.net:1433;database=<your-db>;encrypt=true;trustServerCertificate=false;loginTimeout=30;
spring.datasource.username=${AZURE_DB_USERNAME}
spring.datasource.password=${AZURE_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HikariCP pool settings
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:30}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# Azure Cache for Redis
spring.data.redis.host=${AZURE_REDIS_HOST}
spring.data.redis.port=${AZURE_REDIS_PORT:6380}
spring.data.redis.password=${AZURE_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# Azure Service Bus (cross-instance WebSocket relay)
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING}
azure.servicebus.topic-name=${AZURE_SERVICEBUS_TOPIC:websocket-relay}